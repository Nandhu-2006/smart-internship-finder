<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Pathway logo samples</title><desc id="desc">Three original purple and pink logo ideas for a student internship finder.</desc>
<defs>
 <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7048e8"/><stop offset="1" stop-color="#ec4f9b"/></linearGradient>
 <linearGradient id="grad2" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ec4f9b"/><stop offset="1" stop-color="#7048e8"/></linearGradient>
 <linearGradient id="grad3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5d3bd2"/><stop offset="1" stop-color="#e34c99"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#463278" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="470" rx="28" fill="#f8f6fc"/>
<text x="48" y="55" fill="#25223b" font-family="Arial,sans-serif" font-size="24" font-weight="700">Pathway · original logo directions</text>
<text x="48" y="81" fill="#88849a" font-family="Arial,sans-serif" font-size="13">Student-first • Purple + pink • Designed for the internship finder</text>
<!-- concept cards -->
<g filter="url(#shadow)"><rect x="42" y="112" width="354" height="300" rx="20" fill="#fff"/><rect x="423" y="112" width="354" height="300" rx="20" fill="#fff"/><rect x="804" y="112" width="354" height="300" rx="20" fill="#fff"/></g>
<!-- 1: Pathway nodes -->
<g transform="translate(219 220)">
 <path d="M-58 40 C-27 40 -29 -34 5 -34 S34 35 62 35" fill="none" stroke="url(#grad1)" stroke-width="13" stroke-linecap="round"/>
 <circle cx="-58" cy="40" r="12" fill="#7048e8"/><circle cx="5" cy="-34" r="12" fill="#ae48d4"/><path d="M47 21l18 14-18 14" fill="none" stroke="#ec4f9b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="219" y="305" text-anchor="middle" fill="#29253e" font-family="Arial,sans-serif" font-size="23" font-weight="700">pathway</text>
<text x="219" y="345" text-anchor="middle" fill="#7148d9" font-family="Arial,sans-serif" font-size="12" font-weight="700">01 · THE CAREER PATH</text>
<text x="219" y="370" text-anchor="middle" fill="#858196" font-family="Arial,sans-serif" font-size="11">A route, a milestone, and forward motion</text>
<!-- 2: P monogram / open door -->
<g transform="translate(600 215)">
 <path d="M-34 46v-87h47c25 0 41 15 41 37S38 32 13 32h-47" fill="none" stroke="url(#grad2)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M13 32l30 22" fill="none" stroke="#ec4f9b" stroke-width="10" stroke-linecap="round"/>
 <circle cx="-34" cy="46" r="8" fill="#7048e8"/>
</g>
<text x="600" y="305" text-anchor="middle" fill="#29253e" font-family="Arial,sans-serif" font-size="23" font-weight="700">pathway</text>
<text x="600" y="345" text-anchor="middle" fill="#7148d9" font-family="Arial,sans-serif" font-size="12" font-weight="700">02 · THE OPEN DOOR</text>
<text x="600" y="370" text-anchor="middle" fill="#858196" font-family="Arial,sans-serif" font-size="11">A custom “P” that opens toward opportunity</text>
<!-- 3: compass / cap -->
<g transform="translate(981 218)">
 <path d="M-65 -4L0 -39 65 -4 0 31z" fill="url(#grad3)"/>
 <path d="M-39 12v26c24 17 54 17 78 0V12" fill="none" stroke="#7048e8" stroke-width="8" stroke-linejoin="round"/>
 <path d="M64 -4v34" stroke="#ec4f9b" stroke-width="6" stroke-linecap="round"/><circle cx="64" cy="34" r="7" fill="#ec4f9b"/>
 <path d="M-1 -19v28" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="-1" cy="14" r="5" fill="#fff"/>
</g>
<text x="981" y="305" text-anchor="middle" fill="#29253e" font-family="Arial,sans-serif" font-size="23" font-weight="700">pathway</text>
<text x="981" y="345" text-anchor="middle" fill="#7148d9" font-family="Arial,sans-serif" font-size="12" font-weight="700">03 · THE NEXT STEP</text>
<text x="981" y="370" text-anchor="middle" fill="#858196" font-family="Arial,sans-serif" font-size="11">A student cap with a destination marker</text>
</svg>
